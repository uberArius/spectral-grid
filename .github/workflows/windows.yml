name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Package
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: SpectralGrid-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
